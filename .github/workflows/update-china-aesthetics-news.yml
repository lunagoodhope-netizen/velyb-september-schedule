name: Update China aesthetics news

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/update-china-aesthetics-news.yml'

permissions:
  contents: write

jobs:
  update-news:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch latest China aesthetics news
        run: |
          node <<'NODE'
          const fs=require('fs');
          const q=encodeURIComponent('中国 医疗美容');
          const url=`https://news.google.com/rss/search?q=${q}&hl=zh-CN&gl=CN&ceid=CN:zh-Hans`;
          const decode=s=>s.replace(/<!\[CDATA\[([\s\S]*?)\]\]>/g,'$1').replace(/&amp;/g,'&').replace(/&quot;/g,'"').replace(/&#39;/g,"'").replace(/&lt;/g,'<').replace(/&gt;/g,'>');
          const tag=(text,name)=>{const match=new RegExp(`<${name}[^>]*>([\\s\\S]*?)<\\/${name}>`).exec(text);return match?decode(match[1].trim()):''};
          (async()=>{
            const xml=await (await fetch(url)).text();
            const item=/<item>([\s\S]*?)<\/item>/.exec(xml)?.[1];
            if(!item)throw Error('No news item');
            const sourceMatch=/<source[^>]*>([\s\S]*?)<\/source>/.exec(item);
            const pubDate=tag(item,'pubDate');
            fs.writeFileSync('news.json',JSON.stringify({title:tag(item,'title'),url:tag(item,'link'),source:sourceMatch?decode(sourceMatch[1].trim()):'Google News',date:pubDate?new Date(pubDate).toLocaleDateString('ko-KR',{timeZone:'Asia/Seoul'}):''},null,2)+'\n');
          })().catch(error=>{console.error(error);process.exit(1)});
          NODE
      - name: Commit refreshed news
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add news.json
          git diff --cached --quiet || git commit -m 'Update China aesthetics news'
          git push
